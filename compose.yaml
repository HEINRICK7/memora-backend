name: memora

services:
  postgres:
    image: postgres:17.11-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: memora
      POSTGRES_USER: memora
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-memora-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memora -d memora"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    build:
      context: ./dev/minio
      args:
        MINIO_RELEASE: RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-memora_local_admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-memora-local-minio-password}
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:${MEMORA_WEB_PORT:-3300},http://127.0.0.1:${MEMORA_WEB_PORT:-3300}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: .
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: local
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/memora
      SPRING_DATASOURCE_USERNAME: memora
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-memora-local-only}
      MEMORA_LOCAL_OWNER_ID: local-development-owner
      MEMORA_UPLOAD_MAX_BYTES: "20971520"
      MEMORA_CORS_ALLOWED_ORIGINS: http://localhost:${MEMORA_WEB_PORT:-3300},http://127.0.0.1:${MEMORA_WEB_PORT:-3300}
      MINIO_ENDPOINT_INTERNAL: http://minio:9000
      MINIO_ENDPOINT_PUBLIC: http://localhost:9000
      MINIO_BUCKET: memora-private
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-memora_local_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-memora-local-minio-password}
      MINIO_REGION: us-east-1
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  frontend:
    build:
      context: ../memora-frontend
      args:
        NEXT_PUBLIC_MEMORA_API_URL: http://localhost:8080/api/v1
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${MEMORA_WEB_PORT:-3300}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  backend-tests:
    build:
      context: .
      target: build
    command: ["mvn", "-B", "test"]
    environment:
      MEMORA_API_BASE_URL: http://backend:8080
      MEMORA_TEST_JDBC_URL: jdbc:postgresql://postgres:5432/memora
      MEMORA_TEST_JDBC_USERNAME: memora
      MEMORA_TEST_JDBC_PASSWORD: ${POSTGRES_PASSWORD:-memora-local-only}
      MEMORA_INTEGRATION_TESTS: ${MEMORA_INTEGRATION_TESTS:-false}
      MEMORA_MURAL_INTEGRATION_TESTS: ${MEMORA_MURAL_INTEGRATION_TESTS:-false}
      MEMORA_MURAL_METADATA_INTEGRATION_TESTS: ${MEMORA_MURAL_METADATA_INTEGRATION_TESTS:-false}
      MINIO_ENDPOINT_INTERNAL: http://minio:9000
      MINIO_BUCKET: memora-private
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-memora_local_admin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-memora-local-minio-password}
      MINIO_REGION: us-east-1
      MEMORA_CORS_ALLOWED_ORIGINS: http://localhost:${MEMORA_WEB_PORT:-3300},http://127.0.0.1:${MEMORA_WEB_PORT:-3300}
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
