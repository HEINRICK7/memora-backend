spring:
  application:
    name: memora-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/memora}
    username: ${SPRING_DATASOURCE_USERNAME:memora}
    password: ${SPRING_DATASOURCE_PASSWORD:memora}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    placeholders:
      memoraIdentityIssuer: ${OIDC_ISSUER_URI:urn:memora:local}
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db,minio
memora:
  storage:
    internal-endpoint: ${MINIO_ENDPOINT_INTERNAL:http://localhost:9000}
    public-endpoint: ${MINIO_ENDPOINT_PUBLIC:http://localhost:9000}
    bucket: ${MINIO_BUCKET:memora-private}
    access-key: ${MINIO_ACCESS_KEY:memora-local}
    secret-key: ${MINIO_SECRET_KEY:memora-local-only-change-me}
    region: ${MINIO_REGION:us-east-1}
    max-upload-bytes: ${MEMORA_UPLOAD_MAX_BYTES:20971520}
  api:
    cors:
      allowed-origins: ${MEMORA_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
